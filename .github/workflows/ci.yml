name: Repository CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check forbidden tracked files
        run: |
          python3 - <<'PY'
          import subprocess, sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_names = {".DS_Store", ".env", "sdkconfig", "sdkconfig.old", "wifi_secrets.h", "local_config.h"}
          forbidden_prefixes = ("build/", "managed_components/")
          forbidden_suffixes = (".key", ".pem", ".elf", ".map")

          bad = []
          for path in tracked:
              name = path.rsplit("/", 1)[-1]
              if name in forbidden_names or path.startswith(forbidden_prefixes) or path.endswith(forbidden_suffixes):
                  bad.append(path)

          if bad:
              print("Forbidden files tracked in git:", *bad, sep="\n  - ")
              sys.exit(1)
          print(f"Checked {len(tracked)} tracked files: hygiene OK.")
          PY

      - name: Verify local Markdown links
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          errors = []

          for md in sorted(Path(".").rglob("*.md")):
              if any(part.startswith(".") for part in md.parts):
                  continue
              text = md.read_text(encoding="utf-8")
              for raw_target in link_re.findall(text):
                  target = raw_target.strip().split()[0]
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  rel_path = target.split("#", 1)[0]
                  if not rel_path:
                      continue
                  resolved = (md.parent / rel_path).resolve()
                  if not resolved.exists():
                      errors.append(f"{md}: broken link -> {raw_target}")

          if errors:
              print("Broken local Markdown links found:", *errors, sep="\n  - ")
              sys.exit(1)
          print("All local Markdown links are valid.")
          PY
