name: Initialize repository labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create missing labels only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/labels"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          for label in json.loads(Path(".github/labels.json").read_text(encoding="utf-8")):
              lookup_url = f"{base}/{urllib.parse.quote(label['name'], safe='')}"
              try:
                  with urllib.request.urlopen(urllib.request.Request(lookup_url, headers=headers)):
                      print("Retained:", label["name"])
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise SystemExit(f"Label lookup failed for {label['name']}: HTTP {exc.code}") from None
                  req = urllib.request.Request(
                      base,
                      data=json.dumps(label).encode("utf-8"),
                      headers={**headers, "Content-Type": "application/json"},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req):
                          print("Created:", label["name"])
                  except urllib.error.HTTPError as err:
                      raise SystemExit(f"Label creation failed for {label['name']}: HTTP {err.code}") from None
          PY
